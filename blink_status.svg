<svg fill="none" viewBox="0 0 400 60" width="400" height="60" xmlns="http://www.w3.org/2000/svg">
  <!-- Container -->
  <rect x="2" y="10" width="280" height="40" rx="20" fill="#10B981" fill-opacity="0.1" stroke="#10B981" stroke-opacity="0.3" stroke-width="1"/>
  
  <!-- Blinking Indicator -->
  <circle cx="25" cy="30" r="5" fill="#34D399">
    <animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite" />
  </circle>
  
  <!-- Status Text (Uppercase and letter-spacing for premium feel) -->
  <text x="45" y="35" fill="#34D399" font-family="Arial, sans-serif" font-size="14" font-weight="900" letter-spacing="1">BLINK ENGINE: ACTIVE &amp; ONLINE</text>
</svg>
