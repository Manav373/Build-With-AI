<svg width="800" height="200" viewBox="0 0 800 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#061009" />
      <stop offset="100%" stop-color="#030905" />
    </linearGradient>
    
    <!-- Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="coloredBlur" />
      <feMerge>
        <feMergeNode in="coloredBlur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <!-- Outer Container -->
  <rect width="800" height="200" rx="20" fill="url(#bg_grad)" stroke="white" stroke-opacity="0.05"/>
  
  <!-- Pulsing Hub Circles -->
  <circle cx="400" cy="100" r="100" stroke="#34D399" stroke-opacity="0.1" stroke-width="2">
    <animate attributeName="r" values="80;120;80" dur="4s" repeatCount="indefinite" />
    <animate attributeName="stroke-opacity" values="0.1;0.4;0.1" dur="4s" repeatCount="indefinite" />
  </circle>
  <circle cx="400" cy="100" r="180" stroke="#34D399" stroke-opacity="0.05" stroke-width="2">
    <animate attributeName="r" values="150;210;150" dur="6s" repeatCount="indefinite" />
    <animate attributeName="stroke-opacity" values="0.05;0.2;0.05" dur="6s" repeatCount="indefinite" />
  </circle>
  
  <!-- Orbiting Satellite -->
  <g transform="translate(400, 100)">
    <!-- Orbital Path -->
    <circle cx="0" cy="0" r="60" fill="none" stroke="white" stroke-opacity="0.05" stroke-dasharray="2 4"/>
    <g>
      <!-- Satellite Point -->
      <circle cx="60" cy="0" r="4" fill="#34D399" filter="url(#glow)"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="10s" repeatCount="indefinite" />
    </g>
  </g>
  
  <!-- Logo Text -->
  <text x="400" y="110" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="48" font-weight="900" letter-spacing="-2" filter="url(#glow)">
    KRISHI<tspan fill="#10B981">AI</tspan>
  </text>
  
  <!-- Subtitle -->
  <text x="400" y="145" text-anchor="middle" fill="white" fill-opacity="0.4" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="4">ORBITAL INTELLIGENCE NETWORK</text>
</svg>
