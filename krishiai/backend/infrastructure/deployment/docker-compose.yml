version: '3.8'

services:
  backend:
    build:
      context: ../..
      dockerfile: infrastructure/deployment/Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./krishiai.db
      - OPENWEATHER_API_KEY=${OPENWEATHER_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
    volumes:
      - ../../backend/krishiai.db:/app/krishiai.db

  frontend:
    build:
      context: ../..
      dockerfile: infrastructure/deployment/Dockerfile.frontend
      args:
        - VITE_API_BASE_URL=http://localhost:8000
        - VITE_CLERK_PUBLISHABLE_KEY=${VITE_CLERK_PUBLISHABLE_KEY}
    ports:
      - "5173:80"
    depends_on:
      - backend
