events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Backend API upstream
    upstream backend_api {
        server 127.0.0.1:8000;
    }

    # 1. FARMER DOMAIN
    server {
        listen 80;
        server_name farmer.krishiai.com;
        root /var/www/krishiai/frontend/farmer/dist;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location /api/ {
            proxy_pass http://backend_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Krishi-Domain "farmer";
        }
    }

    # 2. VENDOR DOMAIN
    server {
        listen 80;
        server_name vendor.krishiai.com;
        root /var/www/krishiai/frontend/vendor/dist;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location /api/ {
            proxy_pass http://backend_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Krishi-Domain "vendor";
        }
    }

    # 3. ADMIN DOMAIN
    server {
        listen 80;
        server_name admin.krishiai.com;
        root /var/www/krishiai/frontend/admin/dist;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location /api/ {
            proxy_pass http://backend_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Krishi-Domain "admin";
        }
    }
}
