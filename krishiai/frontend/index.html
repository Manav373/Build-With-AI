  <!-- Critical CSS: Preloader -->
  <style>
    .preloader-root {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #030905;
      overflow: hidden;
    }
    .preloader-glow {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      filter: blur(80px);
      animation: preloaderGlowPulse 3s ease-in-out infinite alternate;
    }
    .preloader-glow-1 {
      width: 500px;
      height: 500px;
      top: -100px;
      right: -80px;
      background: radial-gradient(circle, rgba(22, 101, 52, 0.25), transparent 70%);
    }
    .preloader-glow-2 {
      width: 400px;
      height: 400px;
      bottom: -80px;
      left: -60px;
      background: radial-gradient(circle, rgba(74, 222, 128, 0.12), transparent 70%);
      animation-delay: 1.5s;
    }
    .preloader-grid {
      position: absolute;
      inset: 0;
      background-image: linear-gradient(rgba(134, 239, 172, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(134, 239, 172, 0.03) 1px, transparent 1px);
      background-size: 60px 60px;
      mask-image: radial-gradient(ellipse 70% 70% at 50% 50%, black 20%, transparent 100%);
    }
    .preloader-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.2rem;
      position: relative;
      z-index: 2;
    }
    .preloader-logo-wrap {
      position: relative;
      width: 96px;
      height: 96px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .preloader-logo-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 2px solid transparent;
    }
    .preloader-logo-ring-outer {
      border-top-color: rgba(74, 222, 128, 0.7);
      box-shadow: 0 0 18px rgba(74, 222, 128, 0.3);
    }
    .preloader-logo-ring-inner {
      inset: 10px;
      border-bottom-color: rgba(250, 204, 21, 0.6);
    }
    .preloader-brand {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 2.6rem;
      font-weight: 900;
      color: #e2f0e4;
      letter-spacing: -0.05em;
    }
    .preloader-brand-ai {
      background: linear-gradient(90deg, #4ade80, #86efac, #4ade80);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .preloader-bar-track {
      width: 260px;
      height: 4px;
      border-radius: 999px;
      background: rgba(134, 239, 172, 0.1);
      overflow: hidden;
    }
    .preloader-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #166534, #4ade80, #86efac);
    }
    @keyframes preloaderGlowPulse {
      0% { opacity: 0.6; transform: scale(1); }
      100% { opacity: 1; transform: scale(1.12); }
    }
    .preloader-particle {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      will-change: transform, opacity;
    }
    @keyframes particleFloat {
      0%, 100% { transform: translate(0, 0); opacity: var(--op); }
      33% { transform: translate(8px, -18px); opacity: calc(var(--op) * 1.4); }
      66% { transform: translate(-10px, -6px); opacity: calc(var(--op) * 0.7); }
    }
    .skip-to-content {
      position: absolute;
      top: -100px;
      left: 0;
      background: #166534;
      color: white;
      padding: 1rem;
      z-index: 10001;
      transition: top 0.3s;
    }
    .skip-to-content:focus {
      top: 0;
    }
  </style>
